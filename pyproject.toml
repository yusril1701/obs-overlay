[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-overlay"
version = "1.1.0"
description = "Transparent, click-through overlay for Windows with interactive window masking (parcels), fed from OBS/Spout2, NDI, screen capture or an image."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "obs-overlay contributors" }]
keywords = ["obs", "spout", "ndi", "screen-capture", "overlay", "transparent", "click-through", "pyqt6", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Display",
]

# Runtime dependencies.
#
# Only PyQt6 and numpy are cross-platform. The Windows-only bits carry an
# environment marker so that `pip install -e .[dev]` still works on Linux/macOS
# for running the pure-logic and headless-Qt test suite in CI.
dependencies = [
    "PyQt6>=6.5,<7",
    "numpy>=1.22",
    "pywin32>=306; sys_platform == 'win32'",
    "SpoutGL>=0.1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
]
build = [
    "pyinstaller>=6.6",
]
# The NDI source is optional: the binding is useless without the NDI Runtime,
# which cannot be redistributed and has to be installed separately from
# https://ndi.video/download-ndi-sdk/ .
#
# Deliberately left without a python_version marker. Current ndi-python wheels
# start at CPython 3.10, so on 3.9 this extra fails loudly with "no matching
# distribution" — which is the truth. A marker would make it install nothing
# and leave the NDI source mysteriously missing.
ndi = [
    "ndi-python>=5.1",
]

[project.urls]
Homepage = "https://github.com/yusril1701/obs-overlay"
Repository = "https://github.com/yusril1701/obs-overlay"
Issues = "https://github.com/yusril1701/obs-overlay/issues"

# Entry points.
#   obs-overlay      -> console script (keeps a console window, useful for logs)
#   obs-overlay-gui  -> windowed script (no console; the normal way to run it)
[project.scripts]
obs-overlay = "obs_overlay.__main__:main"

[project.gui-scripts]
obs-overlay-gui = "obs_overlay.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obs_overlay = ["resources/**/*"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument (Qt idioms)
    "RUF012",  # mutable class attrs need ClassVar (noisy with Qt)
    # The UI text deliberately uses en/em dashes, × and · . Flagging them as
    # "ambiguous unicode" would mean spelling the product's own labels wrong.
    "RUF001",
    "RUF002",
    "RUF003",
]
# Relative imports inside the package are deliberate: they keep `obs_overlay`
# relocatable and make the layer a module belongs to obvious at the import
# line. flake8-tidy-imports is therefore not enabled.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["obs_overlay"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "windows: tests that only run on Windows",
    "gui: tests that need a Qt application instance",
]
filterwarnings = ["error::DeprecationWarning:obs_overlay.*"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
# python_version is deliberately unset: current mypy refuses to target 3.9, and
# the runtime floor is enforced by ruff's target-version plus the CI matrix.
files = ["src/obs_overlay"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Qt's dynamic attributes and the optional Windows-only modules make full
# strictness impractical; these settings catch real bugs without noise.
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["SpoutGL.*"]
ignore_missing_imports = true

# These modules only ever load on Windows, and are guarded behind a platform
# check before import. Off Windows, `ctypes.WinDLL`, `ctypes.WinError` and the
# last-error helpers do not exist, so mypy running on Linux/macOS flags every
# use. Checking them properly needs `mypy --platform win32`, which the Windows
# CI job runs.
[[tool.mypy.overrides]]
module = ["obs_overlay.native.win32_window", "obs_overlay.native.hotkeys"]
disable_error_code = ["attr-defined", "name-defined"]

# Two kinds of unavoidable noise from PyQt6's stubs, muted for the widget layer
# only — both stay enabled everywhere else, which is where real bugs would be.
#
# union-attr: the stubs mark almost every getter Optional. QMenu.addMenu(),
#   QWidget.style() and QComboBox.lineEdit() all return `T | None` even where Qt
#   documents they cannot be null in the calling context.
# override:  every Qt event handler is stubbed as taking `QEvent | None`, so any
#   override with the precise event type is reported as a Liskov violation. Qt
#   never delivers None to these.
[[tool.mypy.overrides]]
module = ["obs_overlay.ui.*"]
disable_error_code = ["union-attr", "override"]
