name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Qt needs a platform plugin even for headless tests.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests --output-format github

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux covers the pure logic and the headless Qt paths cheaply across
        # the supported range; Windows is where the Spout and Win32 code
        # actually runs. SpoutGL ships no wheel above CPython 3.13.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for headless Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --cov=obs_overlay --cov-report=term-missing

      - name: Type-check as Windows
        if: runner.os == 'Windows'
        run: mypy --platform win32

      - name: Verify the CLI starts
        run: |
          python -m obs_overlay --version
          python -m obs_overlay --list-profiles || true

  build:
    name: Build Windows executable
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned exactly: SpoutGL has no wheel above 3.13 and a floating
          # "3.x" would silently move to a version with no wheel at all.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Generate the icon
        run: python packaging/make_icon.py

      - name: Build with PyInstaller
        run: >
          pyinstaller packaging/ObsOverlay.spec
          --noconfirm
          --distpath packaging/dist
          --workpath packaging/build

      - name: Smoke-test the bundle
        shell: pwsh
        run: |
          $exe = "packaging/dist/ObsOverlay/ObsOverlay.exe"
          if (-not (Test-Path $exe)) { throw "Executable not produced" }
          # Exercises the frozen import graph; a missing hidden import or
          # native DLL fails here rather than on a user's machine.
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Executable failed to start ($LASTEXITCODE)" }

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ObsOverlay-windows-x64
          path: packaging/dist/ObsOverlay/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach the build to the release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ObsOverlay-windows-x64
          path: dist/ObsOverlay

      - name: Create the archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist/ObsOverlay/* -DestinationPath "ObsOverlay-$version-windows-x64.zip"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: ObsOverlay-*-windows-x64.zip
          generate_release_notes: true
